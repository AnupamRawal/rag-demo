[project]
name = "langchain-rag-demo"
version = "0.1.0"
description = "PDF RAG demo: Streamlit + LangChain + Groq open-source models"
readme = "README.md"
authors = [
    { name = "AnupamRawal", email = "rawalanupam5@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "pypdf>=6.20.1",
    "streamlit>=1.65.0",
    "langchain>=1.0",
    "langchain-community>=0.4",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langchain-huggingface>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-chroma>=1.0",
    "chromadb>=1.0",
    "sentence-transformers>=5.0",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false